    <h1>Welcome to My Practice Website</h1>

    <p>This website is being used to learn Meta Ads and Meta Pixel.</p>

    <h2>Vitamin C Serum</h2>

    <p>Practice product page for Meta Ads tracking.</p>
    <form id="leadForm">
    <input type="text" id="name" placeholder="Your Name" required>
    <input type="email" id="email" placeholder="Your Email" required>
    <button type="submit">Submit</button>
</form>

<p id="successMessage" style="display:none;">
    Thank you! Your lead has been submitted.
</p>
    <script>
document.getElementById("leadForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const eventId = crypto.randomUUID();

    // Browser-side Meta Pixel event
    fbq('track', 'Lead', {}, {eventID: eventId});

    // Server-side Meta CAPI event
    await fetch("https://justforlearning.vercel.app/api/meta-capi", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            event_name: "Lead",
            event_id: eventId,
            event_source_url: window.location.href
        })
    });

    document.getElementById("leadForm").style.display = "none";
    document.getElementById("successMessage").style.display = "block";
});
</script>
